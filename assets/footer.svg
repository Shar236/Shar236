<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .footer-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        fill: #525866;
        letter-spacing: -0.01em;
      }
      
      .footer-quote {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-style: italic;
        font-size: 12.5px;
        fill: #8E939E;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .logo-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #ffffff;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      /* Animated sliding highlight */
      @keyframes slide-glow {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(800px); }
      }
      
      .sliding-highlight {
        animation: slide-glow 12s linear infinite;
      }
    </style>

    <!-- Top Border Gradients (Cyan to Purple separator) -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.0)" />
      <stop offset="25%" stop-color="rgba(0, 201, 255, 0.05)" />
      <stop offset="50%" stop-color="rgba(0, 201, 255, 0.3)" /> <!-- Cyan pulse center -->
      <stop offset="75%" stop-color="rgba(127, 0, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 201, 255, 0)" />
      <stop offset="50%" stop-color="rgba(0, 201, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 201, 255, 0)" />
    </linearGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="100" rx="16" fill="#070709" />
  
  <!-- Grid Overlay -->
  <rect width="800" height="100" rx="16" fill="url(#grid)" />

  <!-- Premium top separator line with gradient -->
  <line x1="0" y1="1" x2="800" y2="1" stroke="url(#lineGradient)" stroke-width="1" />
  
  <!-- Sliding glow highlight on top border -->
  <rect x="0" y="0" width="400" height="2" fill="url(#glowPulse)" class="sliding-highlight" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="799" height="99" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- LEFT SIDE: Logo & Motto -->
  <g transform="translate(45, 54)">
    <!-- Abstract Diamond/V Logo -->
    <polygon points="0,-12 8,2 0,16 -8,2" fill="none" stroke="#00C9FF" stroke-width="1.8" />
    <polygon points="0,-6 4,1 0,8 -4,1" fill="#00C9FF" />
    
    <!-- Logo Text -->
    <text x="20" y="2" class="logo-text">SK // DEV</text>
    <text x="20" y="16" class="footer-text">© 2026. Code • Learn • Build • Repeat.</text>
  </g>

  <!-- RIGHT SIDE: Quote -->
  <g transform="translate(755, 54)">
    <text x="0" y="2" class="footer-quote" text-anchor="end">"Programs must be written for people to read."</text>
    <text x="0" y="16" class="footer-text" text-anchor="end">— Harold Abelson // Computer Scientist</text>
  </g>
</svg>
