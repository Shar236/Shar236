<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 180" width="100%" height="180">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 19px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #696E79;
        line-height: 1.5;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #A855F7; /* Purple accent */
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .text-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #A5B4FC;
        font-weight: 600;
      }

      .nft-meta {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 7.5px;
        fill: #8E939E;
      }

      .nft-val {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #A855F7;
        font-weight: 700;
      }
    </style>

    <radialGradient id="bgGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.12)" />
      <stop offset="60%" stop-color="rgba(168, 85, 247, 0.01)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)" />
    </linearGradient>

    <!-- Glowing collectible pattern -->
    <linearGradient id="collectibleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00C9FF" />
    </linearGradient>

    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="180" rx="16" fill="#070709" />
  <rect width="396" height="180" rx="16" fill="url(#grid)" />
  <circle cx="300" cy="120" r="100" fill="url(#bgGlow)" />
  <rect x="0.5" y="0.5" width="395" height="179" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- Content -->
  <g transform="translate(24, 0)">
    <text x="0" y="38" class="text-mono">PROJECT // 03 // HACKATHON WINNER</text>
    <text x="0" y="62" class="text-title">NFT Marketplace</text>
    <text x="0" y="85" class="text-desc">Secured 1st place in Hack-the-Block.</text>
    <text x="0" y="101" class="text-desc">Minting, bidding &amp; wallet sync platform.</text>

    <!-- Stack Tag -->
    <g transform="translate(0, 130)">
      <rect width="185" height="20" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="10" y="13" class="text-tag">Solidity • React • Web3</text>
    </g>
  </g>

  <!-- Graphic Preview (NFT Art Card) -->
  <g transform="translate(245, 25)">
    <!-- Card Frame -->
    <rect width="120" height="130" rx="8" fill="#0d0d12" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    
    <!-- Image Card Cover -->
    <rect x="8" y="8" width="104" height="74" rx="6" fill="#181820" />
    <!-- Gradient glowing element inside art -->
    <circle cx="60" cy="45" r="22" fill="url(#collectibleGlow)" opacity="0.85" />
    <path d="M40,65 L55,40 L70,55 L80,38 L95,65 Z" fill="#181820" opacity="0.9" />

    <text x="10" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#ffffff" font-weight="700">Aether Prism #08</text>
    <text x="10" y="112" class="nft-meta">LAST BID</text>
    
    <!-- Price tag -->
    <g transform="translate(68, 102)">
      <text x="42" y="10" class="nft-val" text-anchor="end">2.84 ICP</text>
    </g>
  </g>
</svg>
