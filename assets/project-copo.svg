<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 180" width="100%" height="180">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 19px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #696E79;
        line-height: 1.5;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #818CF8; /* Purple */
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .text-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #A5B4FC;
        font-weight: 600;
      }

      .progress-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #8E939E;
      }
    </style>

    <radialGradient id="bgGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.12)" />
      <stop offset="60%" stop-color="rgba(129, 140, 248, 0.01)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.15)" />
    </linearGradient>

    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="180" rx="16" fill="#070709" />
  <rect width="396" height="180" rx="16" fill="url(#grid)" />
  <circle cx="300" cy="120" r="100" fill="url(#bgGlow)" />
  <rect x="0.5" y="0.5" width="395" height="179" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- Content -->
  <g transform="translate(24, 0)">
    <text x="0" y="38" class="text-mono">PROJECT // 06 // INTERNSHIP</text>
    <text x="0" y="62" class="text-title">CO-PO Calculator</text>
    <text x="0" y="85" class="text-desc">College attainment analytics engine.</text>
    <text x="0" y="101" class="text-desc">Calculates academic outcome metrics.</text>

    <!-- Stack Tag -->
    <g transform="translate(0, 130)">
      <rect width="185" height="20" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="10" y="13" class="text-tag">React • Express • PostgreSQL</text>
    </g>
  </g>

  <!-- Graphic Preview (Attainment Columns) -->
  <g transform="translate(240, 35)">
    <rect width="130" height="110" rx="8" fill="#0d0d12" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    
    <!-- Target Bars -->
    <!-- Column 1 (CO) -->
    <text x="25" y="24" class="progress-label">CO1</text>
    <rect x="25" y="32" width="80" height="8" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <rect x="25" y="32" width="68" height="8" rx="4" fill="#00C9FF" /> <!-- 85% -->
    
    <!-- Column 2 (PO) -->
    <text x="25" y="56" class="progress-label">PO2</text>
    <rect x="25" y="64" width="80" height="8" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <rect x="25" y="64" width="56" height="8" rx="4" fill="#818CF8" /> <!-- 70% -->

    <!-- Column 3 (Attain) -->
    <text x="25" y="88" class="progress-label">ATTAIN</text>
    <rect x="25" y="96" width="80" height="8" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <rect x="25" y="96" width="76" height="8" rx="4" fill="#10B981" /> <!-- 95% -->
  </g>
</svg>
