<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 300" width="100%" height="300">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 12.5px;
        fill: #8E939E;
        letter-spacing: -0.01em;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #00C9FF; /* Cyan accent */
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .metric-value {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }

      .metric-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #525866;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      /* Animations */
      @keyframes pulse {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      
      .pulse-glow {
        animation: pulse 6s ease-in-out infinite;
        transform-origin: 50px 240px;
      }

      .graph-point {
        animation: pulse-dot 2.5s infinite;
      }

      @keyframes pulse-dot {
        0% { r: 3px; opacity: 0.6; }
        50% { r: 5.5px; opacity: 0.95; }
        100% { r: 3px; opacity: 0.6; }
      }
    </style>

    <radialGradient id="bgGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 201, 255, 0.15)" />
      <stop offset="60%" stop-color="rgba(127, 0, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 201, 255, 0.15)" />
    </linearGradient>

    <!-- Graph Area Gradient -->
    <linearGradient id="graphAreaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 201, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(127, 0, 255, 0.0)" />
    </linearGradient>

    <!-- Graph Line Gradient -->
    <linearGradient id="graphLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="300" rx="16" fill="#070709" />
  
  <!-- Grid Overlay -->
  <rect width="396" height="300" rx="16" fill="url(#grid)" />
  
  <!-- Glow Accent -->
  <circle cx="50" cy="240" r="120" fill="url(#bgGlow)" class="pulse-glow" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="395" height="299" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- HEADER -->
  <g transform="translate(26, 0)">
    <text x="0" y="42" class="text-mono">03 // TELEMETRY</text>
    <text x="0" y="68" class="text-title">Contributions &amp; DSA</text>
    <text x="0" y="88" class="text-subtitle">Telemetry of Git activity &amp; problem solving.</text>
  </g>

  <!-- LEFT COLUMN: Key Metrics -->
  <g transform="translate(26, 0)">
    <!-- Metric 1 -->
    <g transform="translate(0, 115)">
      <text x="0" y="20" class="metric-value">1st Place</text>
      <text x="0" y="34" class="metric-label">HACKATHONS WON</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 170)">
      <text x="0" y="20" class="metric-value">450+</text>
      <text x="0" y="34" class="metric-label">DSA SOLVED</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(0, 225)">
      <text x="0" y="20" class="metric-value">1,240+</text>
      <text x="0" y="34" class="metric-label">COMMITS</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Custom Performance Graph -->
  <g transform="translate(160, 115)">
    <!-- Graph Background Grid Lines -->
    <!-- Horizontal -->
    <line x1="0" y1="0" x2="210" y2="0" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="0" y1="35" x2="210" y2="35" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="0" y1="70" x2="210" y2="70" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="0" y1="105" x2="210" y2="105" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="0" y1="140" x2="210" y2="140" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.2" />

    <!-- Vertical Y-Axis Reference -->
    <line x1="0" y1="0" x2="0" y2="140" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.2" />

    <!-- Graph Glow Fill Area -->
    <path d="M 0,110 C 20,95 40,120 60,75 C 80,30 100,85 120,60 C 140,35 160,15 180,30 C 195,45 205,10 210,15 L 210,140 L 0,140 Z" fill="url(#graphAreaGradient)" />

    <!-- Graph Trend Line -->
    <path d="M 0,110 C 20,95 40,120 60,75 C 80,30 100,85 120,60 C 140,35 160,15 180,30 C 195,45 205,10 210,15" fill="none" stroke="url(#graphLineGradient)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Key Glowing Points -->
    <!-- Point 1 -->
    <g transform="translate(180, 30)">
      <circle cx="0" cy="0" r="3" fill="#00C9FF" />
      <circle cx="0" cy="0" r="5" fill="none" stroke="#00C9FF" stroke-width="1" class="graph-point" />
    </g>
    
    <!-- Point 2 -->
    <g transform="translate(60, 75)">
      <circle cx="0" cy="0" r="3" fill="#00C9FF" />
      <circle cx="0" cy="0" r="5" fill="none" stroke="#00C9FF" stroke-width="1" class="graph-point" />
    </g>

    <!-- Graph Label Monospace -->
    <text x="210" y="152" font-family="'JetBrains Mono', monospace" font-size="8" fill="#525866" text-anchor="end">WEEKLY ACTIVITY MAPPING</text>
  </g>
</svg>
