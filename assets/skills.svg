<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 300" width="100%" height="300">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 12.5px;
        fill: #8E939E;
        letter-spacing: -0.01em;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #00C9FF; /* Cyan accent */
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .tech-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #525866;
        text-anchor: middle;
        font-weight: 500;
      }

      /* Animations */
      @keyframes pulse {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      
      .pulse-glow {
        animation: pulse 6s ease-in-out infinite;
        transform-origin: 320px 60px;
      }

      .icon-box:hover {
        stroke: rgba(0, 201, 255, 0.4);
        fill: rgba(255, 255, 255, 0.04);
      }
    </style>

    <radialGradient id="bgGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 201, 255, 0.15)" />
      <stop offset="60%" stop-color="rgba(0, 201, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 201, 255, 0.15)" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="300" rx="16" fill="#070709" />
  
  <!-- Grid Overlay -->
  <rect width="396" height="300" rx="16" fill="url(#grid)" />
  
  <!-- Glow Accent -->
  <circle cx="320" cy="60" r="120" fill="url(#bgGlow)" class="pulse-glow" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="395" height="299" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- HEADER -->
  <g transform="translate(26, 0)">
    <text x="0" y="42" class="text-mono">02 // ECOSYSTEM</text>
    <text x="0" y="68" class="text-title">Tech Stack &amp; Tooling</text>
    <text x="0" y="88" class="text-subtitle">High-performance languages, engines &amp; tools.</text>
  </g>

  <!-- GRID OF TECH ICONS (4 columns, 2 rows) -->
  <!-- Row 1: C++, React, Python, NodeJS -->
  <!-- Card 1: C++ -->
  <g transform="translate(24, 110)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <!-- C++ Blue Hexagon Shield Symbol -->
    <polygon points="34,16 45,21 45,35 34,44 23,35 23,21" fill="#00599C" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="34" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">C++</text>
    <text x="34" y="58" class="tech-label">C / C++</text>
  </g>

  <!-- Card 2: React -->
  <g transform="translate(116, 110)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <!-- React Atom Symbol -->
    <g transform="translate(34, 30)">
      <ellipse rx="15" ry="5" fill="none" stroke="#00D8FF" stroke-width="1.2" transform="rotate(0)" opacity="0.6"/>
      <ellipse rx="15" ry="5" fill="none" stroke="#00D8FF" stroke-width="1.2" transform="rotate(60)" opacity="0.6"/>
      <ellipse rx="15" ry="5" fill="none" stroke="#00D8FF" stroke-width="1.2" transform="rotate(120)" opacity="0.6"/>
      <circle cx="0" cy="0" r="2.5" fill="#00D8FF" />
    </g>
    <text x="34" y="58" class="tech-label">REACT</text>
  </g>

  <!-- Card 3: Python -->
  <g transform="translate(208, 110)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <!-- Python Snake Art -->
    <g transform="translate(22, 18) scale(0.9)">
      <path d="M12,0 C5,0 5,4 5,4 L5,8 L13,8 L13,10 L3,10 C1,10 0,11 0,14 C0,18 2,18 2,18 L4,18 L4,16 C4,13 6,12 9,12 L15,12 C18,12 18,9 18,9 L18,4 C18,4 18,0 12,0 Z" fill="#38BDF8"/>
      <path d="M13,24 C20,24 20,20 20,20 L20,16 L12,16 L12,14 L22,14 C24,14 25,13 25,10 C25,6 23,6 23,6 L21,6 L21,8 C21,11 19,12 16,12 L10,12 C7,12 7,15 7,15 L7,20 C7,20 7,24 13,24 Z" fill="#FFE873"/>
      <circle cx="8.5" cy="5" r="1" fill="#000000" />
      <circle cx="16.5" cy="19" r="1" fill="#000000" />
    </g>
    <text x="34" y="58" class="tech-label">PYTHON</text>
  </g>

  <!-- Card 4: Node.js -->
  <g transform="translate(300, 110)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <path d="M34,16 L46,23 L46,37 L34,44 L22,37 L22,23 Z" fill="none" stroke="#339933" stroke-width="1.8" />
    <circle cx="34" cy="30" r="3.5" fill="#339933" />
    <path d="M34,22 L34,26.5" stroke="#339933" stroke-width="1.5" />
    <path d="M27.5,33.5 L30.5,32" stroke="#339933" stroke-width="1.5" />
    <path d="M40.5,33.5 L37.5,32" stroke="#339933" stroke-width="1.5" />
    <text x="34" y="58" class="tech-label">NODE.JS</text>
  </g>

  <!-- Row 2: Next.js, Postgres, Docker, AWS -->
  <!-- Card 5: Next.js -->
  <g transform="translate(24, 195)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <circle cx="34" cy="30" r="16" fill="#000000" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M28,37 L34,26 L36,26 L36,34 L34.5,34 L34.5,29.5 L30.2,37 Z" fill="#ffffff" />
    <path d="M38,26 L36.5,26 L34,34 L35.5,34 Z" fill="rgba(255, 255, 255, 0.4)" />
    <text x="34" y="58" class="tech-label">NEXT.JS</text>
  </g>

  <!-- Card 6: PostgreSQL -->
  <g transform="translate(116, 195)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <g transform="translate(34, 30)">
      <path d="M-12,-8 C-12,-11 12,-11 12,-8 C12,-5 -12,-5 -12,-8 Z" fill="rgba(65, 154, 243, 0.25)" stroke="#419AF3" stroke-width="1.5" />
      <path d="M-12,-1 C-12,2 12,2 12,-1" fill="none" stroke="#419AF3" stroke-width="1.5" />
      <path d="M-12,-8 L-12,6 C-12,9 12,9 12,6 L12,-8" fill="none" stroke="#419AF3" stroke-width="1.5" />
      <path d="M-12,6 C-12,9 12,9 12,6" fill="none" stroke="#419AF3" stroke-width="1.5" />
    </g>
    <text x="34" y="58" class="tech-label">POSTGRESQL</text>
  </g>

  <!-- Card 7: Docker -->
  <g transform="translate(208, 195)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <!-- Docker Whale Box outline -->
    <g transform="translate(20, 15)">
      <path d="M2,18 C2,16 6,14 12,14 C18,14 20,16 20,18 L20,23 C20,24 18,25 12,25 C6,25 2,24 2,23 Z" fill="rgba(13, 183, 237, 0.25)" stroke="#0db7ed" stroke-width="1.2"/>
      <rect x="5" y="8" width="4" height="4" fill="#0db7ed" rx="1" />
      <rect x="10" y="8" width="4" height="4" fill="#0db7ed" rx="1" />
      <rect x="15" y="8" width="4" height="4" fill="#0db7ed" rx="1" />
      <rect x="7" y="3" width="4" height="4" fill="#0db7ed" rx="1" />
      <rect x="12" y="3" width="4" height="4" fill="#0db7ed" rx="1" />
    </g>
    <text x="34" y="58" class="tech-label">DOCKER</text>
  </g>

  <!-- Card 8: AWS -->
  <g transform="translate(300, 195)">
    <rect width="68" height="68" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="icon-box" />
    <!-- AWS Swoosh -->
    <g transform="translate(20, 18)">
      <path d="M 5,20 C 10,26 22,26 24,20 C 18,22 10,22 5,20" stroke="#FF9900" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 24,20 L 22,17 M 24,20 L 21,21" stroke="#FF9900" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Small Cloud Structure -->
      <path d="M 8,15 A 4,4 0 0 1 14,11 A 5,5 0 0 1 21,15 A 3,3 0 0 1 20,18 L 8,18 Z" fill="none" stroke="#ffffff" stroke-width="1.2" />
    </g>
    <text x="34" y="58" class="tech-label">AWS / CLOUD</text>
  </g>
</svg>
