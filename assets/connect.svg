<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 280" width="100%" height="280">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #00C9FF;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      /* Animations */
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.08); }
      }
      
      .pulse-glow {
        animation: pulse 5s ease-in-out infinite;
        transform-origin: 148px 160px;
      }

      @keyframes node-pulse {
        0%, 100% { r: 4px; opacity: 0.7; fill: #00C9FF; }
        50% { r: 7px; opacity: 0.95; fill: #7F00FF; }
      }

      .glowing-node {
        animation: node-pulse 3s infinite ease-in-out;
      }
      
      .glowing-node-2 {
        animation: node-pulse 3s infinite ease-in-out;
        animation-delay: 1.5s;
      }
    </style>

    <radialGradient id="bgGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 201, 255, 0.15)" />
      <stop offset="60%" stop-color="rgba(127, 0, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 201, 255, 0.15)" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="296" height="280" rx="16" fill="#070709" />
  
  <!-- Grid Overlay -->
  <rect width="296" height="280" rx="16" fill="url(#grid)" />
  
  <!-- Glow Accent -->
  <circle cx="148" cy="160" r="110" fill="url(#bgGlow)" class="pulse-glow" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="295" height="279" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- HEADER -->
  <g transform="translate(26, 0)">
    <text x="0" y="42" class="text-mono">05 // TELEMETRY</text>
    <text x="0" y="68" class="text-title">Digital Nodes</text>
  </g>

  <!-- DECORATIVE VECTOR NODE GRAPH -->
  <g transform="translate(20, 20)">
    <!-- Interconnecting Line Grid Mesh -->
    <line x1="60" y1="120" x2="130" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />
    <line x1="130" y1="80" x2="200" y2="130" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />
    <line x1="200" y1="130" x2="130" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />
    <line x1="130" y1="180" x2="60" y2="120" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />
    <line x1="130" y1="80" x2="130" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="60" y1="120" x2="200" y2="130" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="2 2" />
    
    <!-- Outer Floating Orbits -->
    <circle cx="130" cy="130" r="60" fill="none" stroke="rgba(0, 201, 255, 0.08)" stroke-width="1" />
    <circle cx="130" cy="130" r="90" fill="none" stroke="rgba(127, 0, 255, 0.05)" stroke-width="1" stroke-dasharray="4 8" />

    <!-- Connected Nodes -->
    <!-- Node Left -->
    <circle cx="60" cy="120" r="4.5" fill="#00C9FF" />
    <circle cx="60" cy="120" r="8" fill="none" stroke="#00C9FF" stroke-width="1" opacity="0.4" />
    
    <!-- Node Top -->
    <circle cx="130" cy="80" r="4.5" fill="#7F00FF" />
    <circle cx="130" cy="80" r="8" fill="none" stroke="#7F00FF" stroke-width="1" opacity="0.4" />
    
    <!-- Node Right -->
    <circle cx="200" cy="130" r="4.5" fill="#00C9FF" />
    <circle cx="200" cy="130" r="8" fill="none" stroke="#00C9FF" stroke-width="1" opacity="0.4" />
    
    <!-- Node Bottom -->
    <circle cx="130" cy="180" r="4.5" fill="#7F00FF" />
    <circle cx="130" cy="180" r="8" fill="none" stroke="#7F00FF" stroke-width="1" opacity="0.4" />

    <!-- Center Glowing Signal -->
    <circle cx="130" cy="130" r="6" fill="#00C9FF" class="glowing-node" />
    <circle cx="130" cy="130" r="12" fill="none" stroke="#00C9FF" stroke-width="1" opacity="0.3" />
    
    <!-- Satellite Signals -->
    <circle cx="95" cy="105" r="4" fill="#7F00FF" class="glowing-node-2" />
    <circle cx="165" cy="155" r="4" fill="#00C9FF" class="glowing-node-2" />
  </g>
</svg>
