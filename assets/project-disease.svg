<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 180" width="100%" height="180">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 19px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #696E79;
        line-height: 1.5;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #3B82F6; /* Blue */
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .text-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #A5B4FC;
        font-weight: 600;
      }

      .node-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7.5px;
        fill: #8E939E;
        text-anchor: middle;
      }
    </style>

    <radialGradient id="bgGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.12)" />
      <stop offset="60%" stop-color="rgba(59, 130, 246, 0.01)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.15)" />
    </linearGradient>

    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="180" rx="16" fill="#070709" />
  <rect width="396" height="180" rx="16" fill="url(#grid)" />
  <circle cx="300" cy="120" r="100" fill="url(#bgGlow)" />
  <rect x="0.5" y="0.5" width="395" height="179" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- Content -->
  <g transform="translate(24, 0)">
    <text x="0" y="38" class="text-mono">PROJECT // 05</text>
    <text x="0" y="62" class="text-title">Disease Prediction</text>
    <text x="0" y="85" class="text-desc">Symptom-based prediction engine.</text>
    <text x="0" y="101" class="text-desc">Python ML models with 85%+ accuracy.</text>

    <!-- Stack Tag -->
    <g transform="translate(0, 130)">
      <rect width="185" height="20" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="10" y="13" class="text-tag">Python • Scikit-Learn • Pandas</text>
    </g>
  </g>

  <!-- Graphic Preview (ML Nodes) -->
  <g transform="translate(240, 35)">
    <rect width="130" height="110" rx="8" fill="#0d0d12" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    
    <!-- Central Node System -->
    <circle cx="35" cy="55" r="14" fill="rgba(59, 130, 246, 0.15)" stroke="#3B82F6" stroke-width="1.2" />
    <text x="35" y="58" class="node-text" fill="#ffffff" font-weight="700">INPUT</text>
    
    <circle cx="95" cy="30" r="12" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1" />
    <text x="95" y="33" class="node-text" fill="#10B981">87%</text>

    <circle cx="95" cy="80" r="12" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1" />
    <text x="95" y="83" class="node-text" fill="#F59E0B">13%</text>
    
    <!-- Connector Lines -->
    <path d="M49,49 L83,36" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M49,61 L83,74" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="2 2" />
    
    <line x1="35" y1="20" x2="35" y2="41" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <line x1="35" y1="69" x2="35" y2="90" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  </g>
</svg>
