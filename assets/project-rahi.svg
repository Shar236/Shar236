<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 180" width="100%" height="180">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 19px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .text-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #696E79;
        line-height: 1.5;
      }
      
      .text-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #10B981; /* Emerald */
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .text-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #A5B4FC;
        font-weight: 600;
      }

      .cal-header {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 8px;
        fill: #ffffff;
        font-weight: 700;
      }

      .cal-day {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7.5px;
        fill: #525866;
        text-anchor: middle;
      }
    </style>

    <radialGradient id="bgGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.12)" />
      <stop offset="60%" stop-color="rgba(6, 182, 212, 0.01)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.15)" />
    </linearGradient>

    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="180" rx="16" fill="#070709" />
  <rect width="396" height="180" rx="16" fill="url(#grid)" />
  <circle cx="300" cy="120" r="100" fill="url(#bgGlow)" />
  <rect x="0.5" y="0.5" width="395" height="179" rx="15.5" fill="none" stroke="url(#borderGradient)" stroke-width="1" />

  <!-- Content -->
  <g transform="translate(24, 0)">
    <text x="0" y="38" class="text-mono">PROJECT // 02</text>
    <text x="0" y="62" class="text-title">RAHI Marketplace</text>
    <text x="0" y="85" class="text-desc">Local hiring &amp; service marketplace.</text>
    <text x="0" y="101" class="text-desc">Connecting users with 50+ providers.</text>

    <!-- Stack Tag -->
    <g transform="translate(0, 130)">
      <rect width="185" height="20" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="10" y="13" class="text-tag">React • Express • MongoDB</text>
    </g>
  </g>

  <!-- Graphic Preview (Booking / Calendar Grid) -->
  <g transform="translate(240, 35)">
    <rect width="130" height="110" rx="8" fill="#0d0d12" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <path d="M0,22 L130,22" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    
    <text x="12" y="14" class="cal-header">BOOKING CALENDAR</text>
    
    <!-- Calendar Days -->
    <!-- Headers -->
    <text x="25" y="38" class="cal-day" font-weight="700" fill="#6366F1">M</text>
    <text x="50" y="38" class="cal-day" font-weight="700" fill="#6366F1">T</text>
    <text x="75" y="38" class="cal-day" font-weight="700" fill="#6366F1">W</text>
    <text x="100" y="38" class="cal-day" font-weight="700" fill="#6366F1">T</text>

    <!-- Row 1 -->
    <text x="25" y="58" class="cal-day">08</text>
    <text x="50" y="58" class="cal-day">09</text>
    <!-- Selected Active Day Card -->
    <g transform="translate(63, 47)">
      <rect width="24" height="16" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1" />
      <text x="12" y="11" class="cal-day" font-weight="700" fill="#06B6D4">10</text>
    </g>
    <text x="100" y="58" class="cal-day">11</text>
    
    <!-- Row 2 -->
    <text x="25" y="80" class="cal-day">15</text>
    <text x="50" y="80" class="cal-day">16</text>
    <text x="75" y="80" class="cal-day">17</text>
    <text x="100" y="80" class="cal-day">18</text>
    
    <!-- Bottom line indicators -->
    <line x1="25" y1="94" x2="105" y2="94" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>
</svg>
